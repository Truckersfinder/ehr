# Reverse proxy for Imani EHR (Node listens on 127.0.0.1:3000).
# Install: scripts/provision-imani-https.sh copies this to sites-available.
# Certbot edits this file to add TLS listens and certificates.

map $http_upgrade $connection_upgrade_imani {
    default upgrade;
    "" close;
}

server {
    listen 80;
    listen [::]:80;
    server_name imaniehr.com www.imaniehr.com;

    # Allow Let's Encrypt HTTP-01
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_imani;
        proxy_read_timeout 86400;
    }
}
